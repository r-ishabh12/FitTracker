spring.application.name=fitness-monolith
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

#Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fittracker}
spring.datasource.username=${DB_USER:fittracker}
spring.datasource.password=${DB_PWD:fittracker}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${APP_JWT_SECRET:Zml0dHJhY2tlci1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQtMzItYnl0ZXM=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
