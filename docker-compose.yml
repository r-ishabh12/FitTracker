services:
  postgres:
    image: postgres:17-alpine
    container_name: fittracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fittracker}
      POSTGRES_USER: ${DB_USER:-fittracker}
      POSTGRES_PASSWORD: ${DB_PWD:-fittracker}
    ports:
      - "5432:5432"
    volumes:
      - fittracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fittracker} -d ${DB_NAME:-fittracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fittracker-postgres-data:
